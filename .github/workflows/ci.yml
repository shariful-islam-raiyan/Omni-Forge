name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: fmt, clippy, test, build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install Python toolchain (required by the python-backend adapter)
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Node.js (required by the node-backend/typescript-backend adapters)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Go (required by the go-backend adapter)
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Unit + integration tests
        run: cargo test --workspace

      - name: Build release CLI
        run: cargo build --workspace --release

      - name: omni doctor (confirms the Python toolchain is actually detected)
        shell: bash
        run: cargo run -q -p omni-cli --manifest-path Cargo.toml -- doctor

      - name: Validate example manifests (omni check)
        shell: bash
        run: |
          cd examples/hello-web
          cargo run -q -p omni-cli --manifest-path ../../Cargo.toml -- check
          cd ../hello-backend
          cargo run -q -p omni-cli --manifest-path ../../Cargo.toml -- check
          cd ../hello-node
          cargo run -q -p omni-cli --manifest-path ../../Cargo.toml -- check
          cd ../hello-typescript
          cargo run -q -p omni-cli --manifest-path ../../Cargo.toml -- check
          cd ../hello-go
          cargo run -q -p omni-cli --manifest-path ../../Cargo.toml -- check
          cd ../hello-windows
          cargo run -q -p omni-cli --manifest-path ../../Cargo.toml -- check
          cd ../hello-fullstack
          cargo run -q -p omni-cli --manifest-path ../../Cargo.toml -- check
          cd ../navbar-demo
          cargo run -q -p omni-cli --manifest-path ../../Cargo.toml -- check

      - name: Build the web example and verify artifacts
        shell: bash
        run: |
          cd examples/hello-web
          cargo run -q -p omni-cli --manifest-path ../../Cargo.toml -- build web
          test -f dist/web/index.html
          test -f dist/web/assets/style.css
          test -f dist/web/build-manifest.json
          test -f dist/build-report.json
          grep -q "Hello, OmniForge" dist/web/index.html
          test -f dist/web/robots.txt
          test -f dist/web/sitemap.xml
          cargo run -q -p omni-cli --manifest-path ../../Cargo.toml -- seo check web
          cargo run -q -p omni-cli --manifest-path ../../Cargo.toml -- clean

      - name: Build the backend example and verify artifacts (real Python execution)
        shell: bash
        run: |
          cd examples/hello-backend
          cargo run -q -p omni-cli --manifest-path ../../Cargo.toml -- build backend
          test -f dist/backend/app/service.py
          test -f dist/backend/run-config.json
          test -f dist/backend/output.txt
          test -f dist/backend/build-manifest.json
          test -f dist/build-report.json
          grep -q "Hello from hello-backend" dist/backend/output.txt
          cargo run -q -p omni-cli --manifest-path ../../Cargo.toml -- clean

      - name: Build the node-backend example and verify artifacts (real Node execution)
        shell: bash
        run: |
          cd examples/hello-node
          cargo run -q -p omni-cli --manifest-path ../../Cargo.toml -- build backend
          test -f dist/backend/app/service.js
          test -f dist/backend/output.txt
          test -f dist/build-report.json
          grep -q "Hello from hello-node" dist/backend/output.txt
          cargo run -q -p omni-cli --manifest-path ../../Cargo.toml -- clean

      - name: Build the typescript-backend example and verify artifacts (real tsc + Node execution)
        shell: bash
        run: |
          cd examples/hello-typescript
          cargo run -q -p omni-cli --manifest-path ../../Cargo.toml -- build backend
          test -f dist/backend/app/service.js
          test -f dist/backend/source.ts
          test -f dist/backend/output.txt
          test -f dist/build-report.json
          grep -q "Hello from hello-typescript" dist/backend/output.txt
          cargo run -q -p omni-cli --manifest-path ../../Cargo.toml -- clean

      - name: Build the go-backend example and verify artifacts (real go build + execution)
        shell: bash
        run: |
          cd examples/hello-go
          cargo run -q -p omni-cli --manifest-path ../../Cargo.toml -- build backend
          test -f dist/backend/source.go
          test -f dist/backend/output.txt
          test -f dist/build-report.json
          grep -q "Hello from hello-go" dist/backend/output.txt
          cargo run -q -p omni-cli --manifest-path ../../Cargo.toml -- clean

      - name: Build the windows-desktop example and verify artifacts (real rustc build + execution)
        shell: bash
        run: |
          cd examples/hello-windows
          cargo run -q -p omni-cli --manifest-path ../../Cargo.toml -- build windows
          test -f dist/windows/source.rs
          test -f dist/windows/output.txt
          test -f dist/build-report.json
          grep -q "Hello from hello-windows" dist/windows/output.txt
          cargo run -q -p omni-cli --manifest-path ../../Cargo.toml -- clean

      - name: Build the full-stack example (both targets) and verify artifacts
        shell: bash
        run: |
          cd examples/hello-fullstack
          cargo run -q -p omni-cli --manifest-path ../../Cargo.toml -- build all
          test -f dist/web/index.html
          test -f dist/web/assets/api-client.js
          test -f dist/backend/app/service.py
          test -f dist/backend/run-config.json
          test -f dist/backend/output.txt
          test -f dist/build-report.json
          cargo run -q -p omni-cli --manifest-path ../../Cargo.toml -- clean

      - name: Build the navbar-demo example (component composition) and verify artifacts
        shell: bash
        run: |
          cd examples/navbar-demo
          cargo run -q -p omni-cli --manifest-path ../../Cargo.toml -- build web
          test -f dist/web/index.html
          grep -q 'class="navbar"' dist/web/index.html
          grep -q 'class="page"' dist/web/index.html
          cargo run -q -p omni-cli --manifest-path ../../Cargo.toml -- clean

  browser-e2e:
    name: real-browser E2E (hello-fullstack)
    # Separate job, deliberately: a Node/Playwright-side issue must never
    # block the core Rust gate above. See integration-tests/browser/README.md
    # for why this suite exists outside the Cargo workspace.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Python toolchain (required by the python-backend adapter)
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build the omni CLI
        run: cargo build -p omni-cli --release

      - name: Install Playwright and Chromium
        working-directory: integration-tests/browser
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run the real-browser suite against a real omni dev process
        working-directory: integration-tests/browser
        run: npm test

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: integration-tests/browser/playwright-report/
          retention-days: 7

  android:
    name: android-gradle adapter (real Gradle build)
    # Separate job, deliberately, same principle as browser-e2e: a real
    # Android build depends on this runner image's own Android SDK/JDK/
    # Gradle versions actually being compatible with this adapter's
    # pinned AGP/Kotlin/compileSdk combination (see
    # docs/decisions/0011-android-gradle-adapter.md) -- verified directly
    # on this project's own development machine, but NOT verified against
    # GitHub-hosted runners as part of that milestone (no access to run
    # GitHub Actions from that environment). Isolating this job means a
    # real CI-image incompatibility here is a visible, triageable finding
    # rather than a break in the shared fmt/clippy/test gate above.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: omni doctor (shows exactly which SDK/JDK/Gradle this runner has)
        run: cargo run -q -p omni-cli --manifest-path Cargo.toml -- doctor || true

      - name: Run the real android-gradle adapter test suite
        env:
          OMNIFORGE_RUN_ANDROID_E2E: "1"
        run: cargo test -p omni-android-adapter

      - name: Build examples/hello-android and verify the real APK
        run: |
          cd examples/hello-android
          cargo run -q -p omni-cli --manifest-path ../../Cargo.toml -- check
          cargo run -q -p omni-cli --manifest-path ../../Cargo.toml -- build android
          test -f dist/android/app-debug.apk
          unzip -l dist/android/app-debug.apk | grep -q AndroidManifest.xml
          cargo run -q -p omni-cli --manifest-path ../../Cargo.toml -- clean
