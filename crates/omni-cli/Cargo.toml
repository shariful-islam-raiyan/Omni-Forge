[package]
name = "omni-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "omni_cli"
path = "src/lib.rs"

[[bin]]
name = "omni"
path = "src/main.rs"

[dependencies]
omni-core = { path = "../omni-core" }
omni-adapter-api = { path = "../omni-adapter-api" }
omni-web-adapter = { path = "../omni-web-adapter" }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
walkdir = { workspace = true }
ctrlc = { workspace = true }

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"
predicates = "3"
