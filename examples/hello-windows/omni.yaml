schema: omniforge.dev/project/v1

project:
  name: hello-windows
  version: 0.1.0

targets:
  web:
    enabled: false
  android:
    enabled: false
  ios:
    enabled: false
  windows:
    enabled: true
    adapter: windows-desktop
    entry: windows/app.yaml
  linux:
    enabled: false
  macos:
    enabled: false
  backend:
    enabled: false

components:
  directory: lib/components

build:
  output: dist
  cache: true
  parallel: false

security:
  strict_adapter_permissions: true
  audit_dependencies: true
