schema: omniforge.dev/component/v1

name: svc.greeter
version: 1.0.0
kind: service

interface:
  inputs:
    greeting:
      type: string
      required: false
      default: "Hello from the OmniForge typescript-backend adapter."
    count:
      type: number
      required: false
      default: 1

implementations:
  backend:
    adapter: typescript-backend
    source: ./service.ts
