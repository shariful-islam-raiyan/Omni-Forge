schema: omniforge.dev/component/v1

name: ui.home
version: 1.0.0
kind: ui

interface:
  inputs:
    title:
      type: string
      required: true
    message:
      type: string
      required: false
      default: "This page was rendered by the OmniForge web-static adapter from a validated component template."

implementations:
  web:
    adapter: web-static
    source: ./home.html.tmpl
