[workspace]
resolver = "2"
members = [
    "crates/omni-core",
    "crates/omni-adapter-api",
    "crates/omni-web-adapter",
    "crates/omni-android-adapter",
    "crates/omni-windows-adapter",
    "crates/omni-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.75"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
jsonschema = { version = "0.18", default-features = false }
anyhow = "1"
thiserror = "1"
clap = { version = "4", features = ["derive"] }
sha2 = "0.10"
walkdir = "2"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
libc = "0.2"
ctrlc = "3"
zip = { version = "9", default-features = false, features = ["deflate"] }

[profile.release]
opt-level = 2
