schema: omniforge.dev/adapter/v1
id: node-backend
version: 0.1.0
protocol: out-of-process/v1

capabilities:
  languages:
    - javascript
  component_kinds:
    - service
  targets:
    - backend
  operations:
    - validate
    - compile
  requires:
    - node

# Declares that this adapter's packaged build output (app/<script>,
# run-config.json) can be started as a long-running dev server by `omni
# dev`. Identical "runnable-package convention" python-backend's adapter.yaml
# documents (see docs/adapter-protocol.md) -- generic across any
# ProcessAdapter, not Python-specific. A backend script that doesn't
# recognize --serve simply isn't dev-serve-capable, which `omni dev`
# reports plainly rather than assuming.
dev:
  args: ["--serve", "{port}"]
  ready_stdout_prefix: "LISTENING"
  ready_timeout_ms: 10000
  stop_grace_ms: 3000
